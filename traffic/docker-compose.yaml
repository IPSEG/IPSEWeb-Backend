version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"  # 호스트의 80 포트를 컨테이너의 80 포트로 매핑
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Nginx 설정 파일을 컨테이너로 마운트
    depends_on:
      - spring-app
    networks:
      - app-network

  spring-app:
    image: localhost:5000/traffic-auth:0.0.1-SNAPSHOT
    container_name: traffic-auth
    expose:
      - "8080"  # 컨테이너 내부 네트워크에서만 8080 포트 노출
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
